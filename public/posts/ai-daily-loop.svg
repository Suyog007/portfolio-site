<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="The daily loop: I describe one small step, the agent types, I read the diff, and either keep it or send it back around.">
  <style>
    :root {
      --d-strong: #22201c; --d-muted: #6b655c; --d-line: #d8cfc0; --d-fill: #f2ece2;
      --d-accent: #b5492f; --d-soft: #f3d9cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --d-strong: #ece6dc; --d-muted: #a39b8f; --d-line: #3f3a33; --d-fill: #211f1c;
        --d-accent: #e48a6f; --d-soft: #3a251e;
      }
    }
    .box { fill: var(--d-fill); stroke: var(--d-line); stroke-width: 1.5; }
    .box-a { fill: var(--d-soft); stroke: var(--d-accent); stroke-width: 1.5; }
    .name { font: 500 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--d-strong); }
    .sub { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--d-muted); }
    .ln { stroke: var(--d-muted); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .n { font: 400 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--d-muted); }
    .mid { text-anchor: middle; }
  </style>

  <rect class="box" x="15" y="36" width="150" height="56" rx="4"/>
  <text class="name" x="31" y="60">I describe</text>
  <text class="sub" x="31" y="78">one small step</text>

  <rect class="box" x="195" y="36" width="150" height="56" rx="4"/>
  <text class="name" x="211" y="60">It types</text>
  <text class="sub" x="211" y="78">no design calls</text>

  <rect class="box" x="375" y="36" width="150" height="56" rx="4"/>
  <text class="name" x="391" y="60">I read the diff</text>
  <text class="sub" x="391" y="78">keep · change · kill</text>

  <rect class="box-a" x="555" y="36" width="150" height="56" rx="4"/>
  <text class="name" x="571" y="60">Keep</text>
  <text class="sub" x="571" y="78">ship it</text>

  <path class="ln" d="M165 64 H187"/>
  <path class="ln" d="M182 59 L188 64 L182 69"/>
  <path class="ln" d="M345 64 H367"/>
  <path class="ln" d="M362 59 L368 64 L362 69"/>
  <path class="ln" d="M525 64 H547"/>
  <path class="ln" d="M542 59 L548 64 L542 69"/>

  <path class="ln" d="M450 92 V148 H90 V100"/>
  <path class="ln" d="M84 103 L90 96 L96 103"/>
  <text class="n mid" x="270" y="164">change or kill, then go again</text>
</svg>
